<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지·공시 | 어린이놀이시설안전관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="notice">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">NOTICE</span>
        <h1>공지·공시</h1>
        <p>회사 소식과 공시 사항을 알려드립니다.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="board-tools">
          <div class="tabs" role="tablist">
            <button class="active" data-cat="전체">전체</button>
            <button data-cat="공지">공지</button>
            <button data-cat="공시">공시</button>
          </div>
          <form class="search" id="notice-search">
            <input type="search" id="notice-keyword" placeholder="제목이나 내용 검색" aria-label="공지 검색">
            <button type="submit" aria-label="검색"><i class="ti ti-search"></i></button>
          </form>
        </div>
        <div class="board" id="notice-board"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
  <script src="js/notice-data.js"></script>
  <script src="js/notice.js"></script>
</body>
</html>
